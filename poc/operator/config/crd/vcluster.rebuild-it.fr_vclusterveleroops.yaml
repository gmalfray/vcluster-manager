---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: vclusterveleroops.vcluster.rebuild-it.fr
spec:
  group: vcluster.rebuild-it.fr
  names:
    kind: VClusterVeleroOps
    listKind: VClusterVeleroOpsList
    plural: vclusterveleroops
    shortNames:
    - vvo
    singular: vclusterveleroops
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.restore.phase
      name: Restore
      type: string
    - jsonPath: .status.backup.phase
      name: Backup
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VClusterVeleroOps carries backup/restore orders for one vcluster.

          It has no spec at all, on purpose. The vcluster it drives is its own
          metadata.name, in namespace vcluster-<name> — adding a spec.vclusterName would
          be a third copy of the same string, and crd-vcluster.md §2.1 argues against
          carrying an environment in spec (the operator runs in the environment it
          reconciles). No spec also means metadata.generation never moves, which is why
          there is no observedGeneration to report either.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: |-
              VClusterVeleroOpsStatus is written only through the /status subresource, by
              the controller only (design §5).
            properties:
              backup:
                description: BackupOpsStatus reports the last handled backup request.
                properties:
                  backupName:
                    type: string
                  lastHandledRequestedAt:
                    description: |-
                      LastHandledRequestedAt is the annotation value already acted on — the
                      Flux `lastHandledReconcileAt` pattern.
                    type: string
                  phase:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              restore:
                description: |-
                  RestoreOpsStatus is a direct transcription of service.VeleroRestoreStatusView:
                  the controller does not invent a new contract, it writes the existing one to
                  status instead of returning it over HTTP.

                  Note what is deliberately absent: a record of how far the destructive sequence
                  got. Both facts that matter — is the volume gone, is a restore running — are
                  read back from the cluster on recovery (service.InspectInterruptedRestore),
                  which cannot go stale the way a written record can.
                properties:
                  firstTerminalAt:
                    description: |-
                      FirstTerminalAt is when the restore was first seen settled. It is what
                      makes the give-up bound survive a controller restart, unlike the in-memory
                      deadline it replaces.
                    format: date-time
                    type: string
                  fromBackup:
                    type: string
                  inPlace:
                    type: boolean
                  lastHandledRequestedAt:
                    type: string
                  phase:
                    type: string
                  restoreName:
                    type: string
                  resumeError:
                    type: string
                  resumeFailed:
                    type: boolean
                  resumePending:
                    type: boolean
                  target:
                    description: Target empty means in-place.
                    type: string
                  volumeDestroyed:
                    description: |-
                      VolumeDestroyed mirrors the app's data-safety flag: the volume was
                      deleted and the restore did not repopulate it.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
