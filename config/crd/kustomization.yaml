# Kustomization dédiée pour que deploy/ puisse référencer la CRD sans la copier :
# `resources: [../../config/crd]`. Le fichier lui-même est généré par
# controller-gen (`make manifests`) et ne doit pas être édité à la main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vcluster.rebuild-it.fr_vclusterveleroops.yaml
  - vcluster.rebuild-it.fr_vclusters.yaml
