<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vCluster Manager - Connexion</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- Charte Rebuild IT : Space Grotesk (titres) + Inter (texte) + JetBrains Mono (code) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="h-full">
    <div class="wf-login-wrap">
        <div class="wf-login-box">
            <!-- Lockup identite, en tete de carte : l'editeur Rebuild IT (mark 4 blocs
                 + wordmark) mene, "vCluster Manager" suit en sous-titre produit. Meme
                 traitement du bloc "ink" du mark qu'en nav (voir layout.html) :
                 --text-secondary sur ce fond sombre plutot que l'ink de charte
                 (#17171F, pense pour fond clair), pour rester net sur --bg. -->
            <div class="flex flex-col items-center mb-8">
                <svg width="44" height="44" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="mb-3" aria-hidden="true">
                    <g transform="translate(6,6)">
                        <rect x="0"  y="0"  width="24" height="24" rx="6" fill="#4338CA"/>
                        <rect x="28" y="0"  width="24" height="24" rx="6" fill="#4F46E5"/>
                        <rect x="0"  y="28" width="24" height="24" rx="6" fill="var(--text-secondary)"/>
                        <rect x="28" y="28" width="24" height="24" rx="6" fill="#FF7A45" transform="rotate(6 40 40)"/>
                    </g>
                </svg>
                <p class="wf-login-wordmark">Rebuild<span style="color:var(--accent);">IT</span></p>
                <p class="wf-login-product">vCluster Manager</p>
                <p class="text-sm mt-3" style="color:var(--text-muted);">Connectez-vous pour continuer</p>
            </div>

            {{if .Error}}
            <div class="wf-alert wf-alert-red mb-6">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor"/></svg>
                <span class="text-sm">{{.Error}}</span>
            </div>
            {{end}}

            <form action="/auth/local/login" method="POST" class="space-y-4">
                <div>
                    <label for="username" class="wf-form-label">Utilisateur</label>
                    <input type="text" name="username" id="username" required autofocus
                        class="wf-form-input mt-1">
                </div>
                <div>
                    <label for="password" class="wf-form-label">Mot de passe</label>
                    <input type="password" name="password" id="password" required
                        class="wf-form-input mt-1">
                </div>
                <button type="submit" class="btn btn-indigo w-full justify-center mt-2">
                    Se connecter
                </button>
            </form>

            {{if .OIDCEnabled}}
            <div class="mt-5 pt-5 text-center" style="border-top:1px solid var(--border-subtle);">
                <a href="/auth/sso" class="text-sm" style="color:var(--indigo);">
                    Se connecter via SSO (Keycloak)
                </a>
            </div>
            {{end}}
        </div>
    </div>
</body>
</html>
