apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcluster-manager
  namespace: vcluster-manager
  labels:
    app: vcluster-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vcluster-manager
  template:
    metadata:
      labels:
        app: vcluster-manager
    spec:
      serviceAccountName: vcluster-manager
      # Durcissement aligné sur celui de l'opérateur, qui l'avait déjà.
      #
      # ⚠️ MIGRATION : fsGroup fait chowner le volume par kubelet au montage. Le
      # PVC existant contient des fichiers appartenant à root, écrits quand ce
      # pod tournait en root. Sur un volume volumineux le premier démarrage est
      # plus lent ; si le driver CSI ne gère pas fsGroup, il faut chowner à la
      # main avant de déployer. À vérifier sur la cell avant de pousser ceci en
      # production.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vcluster-manager
          image: ghcr.io/gmalfray/vcluster-manager:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: vcluster-manager-config
            - secretRef:
                name: vcluster-manager-secrets
            - secretRef:
                name: vcluster-manager-auth
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            # Le seul chemin en écriture est le PVC /app/data, plus /tmp fourni
            # par un emptyDir : rien n'a besoin d'écrire dans l'image.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vcluster-manager-data
        - name: tmp
          emptyDir: {}
