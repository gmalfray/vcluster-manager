apiVersion: v1
kind: ConfigMap
metadata:
  name: vcluster-manager-config
  namespace: vcluster-manager
data:
  # Server
  LISTEN_ADDR: ":8080"
  DATA_DIR: "/app/data"

  # GitLab
  GITLAB_URL: "https://gitlab.example.com"
  GITLAB_SSH_URL: "ssh://git@gitlab.example.com:22"
  GITLAB_ARGOCD_PATH: "ops/argocd"
  # Les variables suivantes sont env-spécifiques : les définir dans l'overlay de chaque env
  # GITLAB_PROJECT_ID, GITLAB_ARGOCD_GROUP_ID, GITLAB_HELM_PROJECT_ID
  # KEYCLOAK_CLIENT_ID, OIDC_CLIENT_ID, OIDC_REDIRECT_URL, VAULT_ADDR
  # RANCHER_URL, RANCHER_ENABLED_PREPROD, RANCHER_ENABLED_PROD

  # Keycloak
  KEYCLOAK_URL: "https://keycloak.example.com"
  KEYCLOAK_REALM: "myrealm"

  # Domains
  BASE_DOMAIN_PREPROD: "preprod.example.com"
  BASE_DOMAIN_PROD: "example.com"

  # TLS secrets (wildcard secrets pre-existing in host clusters)
  TLS_SECRET_PREPROD: "wildcard-preprod-example-com-tls"
  TLS_SECRET_PROD: "wildcard-example-com-tls"

  # vCluster defaults
  DEFAULT_CPU: "8"
  DEFAULT_MEMORY: "32Gi"
  DEFAULT_STORAGE: "500Gi"
  VELERO_TIMEZONE: "Europe/Paris"
  # Qui exécute un backup/restore à la demande :
  #   direct     — le serveur appelle Velero depuis la requête (comportement historique)
  #   annotation — le serveur pose un ordre sur le marqueur VClusterVeleroOps et
  #                l'opérateur l'exécute
  # Interrupteur de migration : il disparaît avec le chemin direct une fois
  # l'opérateur en charge. Basculer sur preprod avant la prod.
  VELERO_TRIGGER_MODE: "direct"
  # Le Pod Security Standard appliqué DANS chaque vcluster, propagé en
  # `policies.podSecurityStandard` par internal/gitops/templates/values.yaml.tmpl.
  #
  # Valait `privileged`, c'est-à-dire « tout est permis ». Conséquence prouvée par
  # exécution le 2026-08-08, pas déduite : un pod `privileged: true` + `hostPID:
  # true` + `hostPath: /`, créé par un tenant DANS SON PROPRE vcluster, était
  # synchronisé tel quel dans le namespace hôte et y démarrait avec ses
  # privilèges — 453 processus du nœud visibles depuis le conteneur, uid=0.
  #
  # Sur un nœud unique, root sur le nœud vaut root sur le control-plane, donc
  # tous les tenants, le bucket de sauvegardes et les secrets de plateforme.
  # L'isolation multi-tenant, qui est la promesse de ce produit, ne reposait
  # alors sur rien d'appliqué : aucun label PSA sur les namespaces hôtes, aucun
  # webhook filtrant les pods, aucune ValidatingAdmissionPolicy les visant. Les
  # quatre verrous possibles étaient absents, vérifiés un par un.
  #
  # `baseline` refuse privileged, hostPID/hostNetwork/hostIPC, les hostPath et
  # les capabilities dangereuses — sans imposer les contraintes de `restricted`
  # (utilisateur non-root obligatoire, seccomp), qui casseraient beaucoup
  # d'images ordinaires.
  #
  # Le moment est choisi : aucun tenant vivant n'utilisait de pod privilégié au
  # moment du changement (les quatre namespaces tenants balayés, rien de
  # privileged/hostPath/hostPID), et les control-plane des vclusters passent
  # déjà `baseline`. Le coût est donc théorique aujourd'hui — il ne le restera
  # pas : un tenant qui a besoin d'un CSI ou d'un agent privilégié devra
  # obtenir une exception, et il n'existe pas de mécanisme pour ça. Le jour où
  # ce cas se présente, c'est une VAP ciblée qu'il faudra écrire, pas un retour
  # à `privileged`.
  VCLUSTER_POD_SECURITY: "baseline"

  # Plafond de ressources de la cell, vérifié par l'opérateur avant tout
  # provisionnement (crd-vcluster.md §5.2). Une marge délibérée, pas la capacité
  # des nœuds : le cluster hôte porte aussi la plateforme.
  #
  # Ces trois valeurs NE SONT PAS optionnelles en pratique : les laisser vides
  # fait refuser toute création de vcluster avec quotas (§5.3). Un opérateur mal
  # configuré est le moment où le contrôle devrait le plus s'appliquer, pas celui
  # où on l'abandonne. À ajuster par overlay selon la taille réelle de la cell.
  RESOURCE_BUDGET_CPU: "32"
  RESOURCE_BUDGET_MEMORY: "128Gi"
  RESOURCE_BUDGET_STORAGE: "2Ti"
  ARGOCD_DEFAULT_POLICY: "role:readonly"

  # Cluster labels
  CLUSTER_LABEL_PREPROD: "Preprod"
  CLUSTER_LABEL_PROD: "Prod"

  # SSH
  SSH_KEY_PATH: "/root/.ssh/id_rsa"

  # Rancher (valeurs par défaut — surcharger dans l'overlay)
  RANCHER_ENABLED_PREPROD: "false"
  RANCHER_ENABLED_PROD: "false"

  # Notifications webhook (optionnel)
  # WEBHOOK_URL contient une URL sensible (token inclus) : mettre dans le Secret, pas ici.
  # Ajouter WEBHOOK_URL dans vcluster-manager-secrets si besoin.
