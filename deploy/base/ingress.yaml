apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vcluster-manager
  namespace: vcluster-manager
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "__CLUSTER_ISSUER__"
spec:
  ingressClassName: nginx
  rules:
    - host: __INGRESS_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vcluster-manager
                port:
                  name: http
  tls:
    - hosts:
        - __INGRESS_HOST__
      secretName: __TLS_SECRET__
---
# `/metrics` n'est pas authentifié, PAR CONCEPTION : c'est un endpoint de scrape
# Prometheus, et le CHANGELOG assume ce choix en le justifiant par « Prom scrape
# interne ». La justification est bonne ; le contexte ne l'était pas.
#
# L'Ingress ci-dessus route `/` en Prefix, donc il servait AUSSI `/metrics` —
# publiquement, sur Internet, sans authentification. Vérifié : HTTP 200, 27 Ko,
# depuis l'extérieur. Ce qui fuyait n'était ni un secret ni un nom de tenant (les
# labels de chemin portent les patterns de route, pas les valeurs — c'est bien
# fait), mais la surface d'API complète, les compteurs d'activité par
# environnement, et `go_info`, c'est-à-dire la version exacte de Go, qui se croise
# avec les CVE.
#
# Cet Ingress-ci existe uniquement pour REPRENDRE ce chemin à celui du dessus :
# nginx choisit le path le plus spécifique, donc `/metrics` en Exact l'emporte sur
# `/` en Prefix, et ce chemin rend 403 à tout le monde.
#
# Le refus ne s'appuie sur AUCUNE adresse source, et c'est délibéré. La version
# précédente utilisait `whitelist-source-range: 127.0.0.1/32` avec le
# raisonnement « le loopback, donc personne ». Mesuré le 2026-08-09 sur la
# plateforme de recette : nginx voit `127.0.0.1` comme adresse source pour le
# trafic venu d'Internet (91 des 100 dernières lignes de son access log), si
# bien que cette whitelist n'autorisait pas personne — elle autorisait tout le
# monde. `/metrics` a répondu 200 depuis Internet, 183 lignes, sans
# authentification.
#
# La règle `allow 127.0.0.1/32; deny all;` était pourtant bien présente dans la
# configuration générée : le défaut n'était pas dans le manifeste mais dans
# l'hypothèse qu'il faisait sur ce que le proxy observe. Une protection qui
# dépend d'une adresse source qu'on ne maîtrise pas ne se contente pas
# d'échouer — elle donne l'illusion d'exister, ce qui est pire que rien.
#
# ⚠️ Cette même cause a une portée qui dépasse ce fichier : nginx propage
# l'adresse qu'il observe à l'application (`proxy_set_header X-Forwarded-For
# $remote_addr`), donc le rate limiter par IP — y compris celui de
# `/auth/login`, 1 req/s burst 5 — ne peut pas distinguer les clients tant que
# cette infrastructure renvoie la même adresse pour tous. À traiter côté
# plateforme, hors de ce dépôt.
#
# Prometheus n'est pas concerné : il scrape le Service, dans le cluster, et ne
# traverse jamais l'Ingress. Un `server-snippet` aurait été plus direct, mais
# `allow-snippet-annotations` vaut `false` sur ce contrôleur (durcissement par
# défaut d'ingress-nginx ≥ 1.9), et c'est très bien ainsi.
#
# La correction de fond serait de servir `/metrics` sur un port séparé, non
# exposé par le Service — l'endpoint cesserait alors d'être exposable par erreur,
# au lieu de dépendre d'un manifeste qu'on peut oublier. Voir TODO.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vcluster-manager-metrics-deny
  namespace: vcluster-manager
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "__CLUSTER_ISSUER__"
    # Refus inconditionnel : `deny 0.0.0.0/0; deny ::/0;` ne dépend d'aucune
    # adresse observée, donc aucune erreur de topologie réseau ne peut le
    # transformer en autorisation. L'Ingress ne sert à rien d'autre qu'à
    # intercepter ce chemin pour que l'Ingress principal ne le serve pas.
    nginx.ingress.kubernetes.io/denylist-source-range: "0.0.0.0/0,::/0"
spec:
  ingressClassName: nginx
  rules:
    - host: __INGRESS_HOST__
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: vcluster-manager
                port:
                  name: http
  tls:
    - hosts:
        - __INGRESS_HOST__
      secretName: __TLS_SECRET__
