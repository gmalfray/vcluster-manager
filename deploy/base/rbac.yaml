apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vcluster-manager
rules:
  # Read HelmReleases status + update/patch for finalizer cleanup and
  # suspend/resume around an in-place Velero restore
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Read Flux Kustomizations status + update/patch for finalizer cleanup and
  # suspend/resume around an in-place Velero restore
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Read vcluster kubeconfig secrets (vc-vcluster-*-ext in each vcluster namespace)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Read ResourceQuota usage
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
  # Read namespaces + update annotations for namespace-protection toggle
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "update"]
  # Velero backup management (list backups, create download requests and restores)
  # Le marqueur d'opérations Velero (VELERO_TRIGGER_MODE=annotation). L'app pose
  # la demande, l'opérateur l'exécute — d'où create/patch ici et pas dans le
  # ClusterRole de l'opérateur, qui ne fait que la lire.
  #
  # Ces droits sont cluster-wide, donc ils ne bornent RIEN à eux seuls : c'est
  # la garde de placement du reconciler (internal/controller/namespace_guard.go)
  # qui fait qu'un marqueur ne peut parler que du vcluster où il vit. Les deux
  # sont indissociables — accorder ceci sans la garde rend n'importe quel
  # vcluster pilotable depuis n'importe quel namespace.
  - apiGroups: ["vcluster.rebuild-it.fr"]
    resources: ["vclusterveleroops"]
    verbs: ["get", "list", "create", "patch"]

  - apiGroups: ["velero.io"]
    resources: ["backups", "restores", "downloadrequests", "schedules"]
    verbs: ["get", "list", "create", "delete"]
  # Scale the vcluster's control-plane and etcd workloads down before an
  # in-place restore (control-plane can be a Deployment or a StatefulSet
  # depending on topology; etcd, when external, is always a StatefulSet)
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "patch", "update"]
  # Delete the vcluster's data PVC so Velero can recreate it from backup
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
  # Wait for the vcluster's pods to actually terminate before deleting their PVC
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vcluster-manager
subjects:
  - kind: ServiceAccount
    name: vcluster-manager
    namespace: vcluster-manager
roleRef:
  kind: ClusterRole
  name: vcluster-manager
  apiGroup: rbac.authorization.k8s.io
---
# Role namespaced pour le backend ConfigMap (STATE_BACKEND=configmap)
# Permet de lire/écrire le ConfigMap vcluster-manager-state dans le namespace de l'app.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vcluster-manager-state
  namespace: vcluster-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vcluster-manager-state"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vcluster-manager-state
  namespace: vcluster-manager
subjects:
  - kind: ServiceAccount
    name: vcluster-manager
    namespace: vcluster-manager
roleRef:
  kind: Role
  name: vcluster-manager-state
  apiGroup: rbac.authorization.k8s.io
