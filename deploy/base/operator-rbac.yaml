# RBAC de l'opérateur VCluster, dérivé de ce que VClusterReconciler touche
# réellement (internal/controller/vcluster_*.go) — pas un cluster-admin de
# confort.
#
# Ce ClusterRole ne couvre QUE le cycle de vie du CR VCluster : sommeil,
# budget, provisionnement, intégrations, status, suppression. La sauvegarde
# et la restauration Velero à la demande (VClusterVeleroOps) sont un AUTRE
# binaire, cmd/veleroops-operator, avec son propre ClusterRole
# (veleroops-operator-rbac.yaml) — voir cmd/operator/main.go pour pourquoi
# les deux ont été séparés. Une conséquence directe : ce ClusterRole ne porte
# ni `restores`, ni `persistentvolumeclaims`, ni `vclusterveleroops` —
# VClusterReconciler n'appelle jamais ces chemins.
#
# `helmreleases`/`kustomizations`/`statefulsets`/`deployments` restent un
# recoupement réel avec cmd/veleroops-operator, pas un oubli de cette
# séparation : `spec.suspend` (SuspendVCluster/ResumeVCluster,
# internal/service/vcluster_lifecycle.go, l'étape « sommeil » du reconcile)
# suspend Flux et scale le vcluster à zéro réplique EXACTEMENT comme le fait
# la restauration in-place — même deux appels de kubernetes.StatusClient
# (SetFluxSuspend, ScaleVClusterWorkloads), pour une raison différente. Les
# deux binaires ont donc chacun leur propre motif d'accès à ces quatre
# ressources ; aucun des deux ne peut faire le travail complet de l'autre pour
# autant (voir TestOperatorRBACCannotDoVeleroOpsWork : ce ClusterRole n'a
# toujours pas `create`/`list` sur les `restores`, ni `delete` sur les
# `persistentvolumeclaims`).
#
# Reste un recoupement réel, pas un oubli : `backups` (get/list/create). Le
# finalizer déclenche lui-même la sauvegarde d'avant destruction et vérifie
# qu'elle a abouti (vcluster_finalizer.go, InspectDeletionBackup/
# TriggerVeleroBackup) — c'est le filet de §4.4, indépendant de ce que
# l'opérateur VeleroOps réconcilie par ailleurs.
#
# Les droits sur les ressources d'un vcluster sont volontairement cluster-wide :
# les namespaces vcluster-* apparaissent et disparaissent, on ne peut pas lister
# des RoleBindings par namespace à l'avance. Le périmètre est donc borné par le
# *type* de ressource, pas par le namespace. À resserrer le jour où un opérateur
# par namespace deviendra réaliste.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vcluster-manager-operator
rules:
  # La CRD VCluster. L'opérateur réconcilie ce que Flux applique depuis
  # fluxprod, il ne crée pas de vcluster lui-même — donc pas de `create`.
  # `update` est là pour le finalizer, et pour lui seul : le poser et le retirer
  # sont des écritures dans metadata, hors sous-ressource status. Tout le reste
  # de ce que l'opérateur écrit passe par vclusters/status.
  - apiGroups: ["vcluster.rebuild-it.fr"]
    resources: ["vclusters"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["vcluster.rebuild-it.fr"]
    resources: ["vclusters/status"]
    verbs: ["get", "update", "patch"]

  # Le provisionnement. L'opérateur applique exactement deux objets par vcluster :
  # son namespace, et le ConfigMap vcluster-<nom>-substitutions dans lequel Flux
  # puise les valeurs dérivées du CR. Server-Side Apply passe par `patch`, mais
  # `create` reste nécessaire au premier tour, quand l'objet n'existe pas encore.
  #
  # Les ConfigMaps, eux, ne sont jamais retirés ressource par ressource :
  # désactiver une option vide une clé, elle ne supprime pas d'objet, et le prune
  # du reste appartient à Flux. D'où l'absence de `delete` sur la règle suivante.
  #
  # UNE seule règle namespaces, volontairement. Il y en avait deux, à deux
  # endroits, chacune rédigée comme si elle était le total : l'union réelle était
  # get,list,watch,create,patch,update cluster-wide, ce que ni l'une ni l'autre
  # ne laissait voir. `update` + `patch` sur n'importe quel namespace permet de
  # réécrire les labels de kube-system, pod-security.kubernetes.io/enforce
  # compris.
  #
  # create/patch : le SSA du provisionnement (namespace du tenant).
  # update : retirer l'annotation protect-deletion juste avant la destruction.
  # delete : la dernière étape du finalizer (arbitrage N6). Elle appartenait à
  #   Flux, c'est-à-dire au prune d'un commit que le finalizer n'écrit ni ne
  #   vérifie : il annonçait donc « suppression terminée » sans rien avoir
  #   supprimé. L'opérateur crée ce namespace en SSA, il le supprime désormais
  #   lui-même — et constate sa disparition avant de lâcher le CR.
  #
  # Ce `delete` est cluster-wide, comme le reste de cette règle. Ce qui le borne,
  # exactement, et pas un mot de plus :
  #
  #   1. le préfixe : la cible est toujours `vcluster-<nom du CR>` — aucun chemin
  #      n'atteint la suppression avec un nom non validé (ValidName est passé par
  #      la garde de placement PUIS par le service) ;
  #   2. le nom réservé : la règle CEL de la CRD refuse `manager`, donc le
  #      namespace de l'app n'est pas visable ;
  #   3. le fait que personne, dans ce dépôt, n'a `create` sur `vclusters`.
  #
  # Le troisième n'est garanti par AUCUN manifeste d'ici, et c'est celui qui
  # porte tout le reste : qui peut créer un CR dans le namespace surveillé peut
  # le supprimer aussitôt, et donc faire détruire le namespace `vcluster-<nom>`
  # correspondant — y compris un vcluster de la flotte historique, qui n'a pas
  # encore de CR et dont le nom est donc libre. Déléguer `create vclusters` à une
  # équipe ÉQUIVAUT à lui donner `delete namespaces` sur tout `vcluster-*`
  # orphelin. À lire avant d'ouvrir la CRD en libre-service.
  #
  # Ce n'est PAS la garde de placement qui borne ce droit, contrairement à ce que
  # dit — à juste titre — le ClusterRole de l'app pour les marqueurs Velero. Là-bas
  # la règle force l'objet dans le namespace de la victime, donc viser quelqu'un
  # exige déjà des droits chez lui. Ici le namespace des `VCluster` est plat et
  # unique (le CR existe avant le namespace dont il parle, cf. namespace_guard.go),
  # donc « l'objet ne parle que de là où il vit » ne discrimine plus personne.
  # Le resserrement qui manque est une ValidatingAdmissionPolicy — voir TODO.md.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]

  # Le contrôle de budget (vcluster_budget.go) additionne les ResourceQuotas de
  # toute la cell pour savoir si un CR de plus tient sous le plafond. Il lit donc
  # à travers les namespaces : `list` cluster-wide, pas un `get` ciblé.
  #
  # Cette règle manquait, et son absence ne se voyait NULLE PART ailleurs qu'en
  # vrai. envtest n'applique pas le RBAC, donc les 41 fichiers de test passaient
  # au vert. Sur un cluster réel, le budget est la troisième étape du reconcile
  # et rend une erreur : aucun `VCluster` n'était réconcilié, jamais — ni
  # provisionnement, ni status, ni finalizer. Le CR restait sans phase pendant
  # que l'opérateur rebouclait sur `resourcequotas is forbidden`.
  #
  # Le ClusterRole de l'app la portait déjà (rbac.yaml). C'est en dérivant celui
  # de l'opérateur de ce que le chemin backup/restore touche qu'on a perdu ce que
  # touche le chemin d'admission — les deux ClusterRoles ne couvraient pas les
  # mêmes appels, et rien ne le vérifiait.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch"]

  # La sauvegarde d'avant destruction (§4.4 étape 2, vcluster_finalizer.go) :
  # InspectDeletionBackup RETROUVE la sauvegarde qui couvre cette suppression
  # en LISTANT (elle n'est notée nulle part), TriggerVeleroBackup en CRÉE une.
  # Pas de `get` : ce reconciler ne lit jamais un backup par son nom — c'est
  # GetVeleroBackupPhase qui ferait ça, et seul cmd/veleroops-operator
  # l'appelle. Pas de `watch` : le finalizer interroge Velero à chaque tour de
  # reconcile, il n'ouvre pas d'informer. Pas de `restores` : cet opérateur
  # n'en crée jamais — la restauration est le domaine de cmd/veleroops-operator.
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["list", "create"]

  # Le status affiché (GetVClusterStatus, GetArgoCDKustomizationStatus) lit le
  # HelmRelease et la Kustomization du tenant ; le teardown (CleanupNamespace,
  # appelé par TeardownVCluster) retire leurs finalizers Flux pour que le
  # namespace puisse vraiment se terminer ; `spec.suspend` les suspend et les
  # reprend (SetFluxSuspend, appelé par SuspendVCluster ET ResumeVCluster) —
  # c'est ce dernier usage qui a besoin de `patch`, absent avant que la
  # réconciliation du sommeil ne soit vérifiée par ce test.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "patch", "update"]

  # `spec.suspend` descend le vcluster à zéro réplique (SuspendVCluster
  # appelle ScaleVClusterWorkloads, qui détecte d'abord la topologie par un
  # `get` sur le StatefulSet etcd — ou son absence — avant de patcher le bon
  # objet, StatefulSet ou Deployment selon le cas). ResumeVCluster ne fait PAS
  # l'inverse : « reprendre Flux suffit, c'est lui qui remonte les répliques »
  # — donc pas de `get` séparé pour la remontée, un seul `get` suffit pour les
  # deux sens.
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "patch"]

  # Parler à l'API interne d'un vcluster (backend d'auth Vault, appairage
  # Rancher, statut ArgoCD/version K8s) : le kubeconfig interne vit dans un
  # Secret du namespace hôte, et l'accès passe par un port-forward SPDY vers
  # le pod du plan de contrôle — jamais par un kubeconfig brut.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

  # Le comptage des pods d'un vcluster pour le status (CountVClusterPods), et
  # la détection d'agents Rancher déjà appairés (HasRancherAgents). Pas de
  # `get` : aucun des deux chemins ne lit un pod par son nom, seulement des
  # listes filtrées par label.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]

  # Élection de leader : deux pods qui se chevauchent pendant un rolling update
  # ne doivent pas piloter la même séquence destructrice.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vcluster-manager-operator
  namespace: vcluster-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vcluster-manager-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vcluster-manager-operator
subjects:
  - kind: ServiceAccount
    name: vcluster-manager-operator
    namespace: vcluster-manager
