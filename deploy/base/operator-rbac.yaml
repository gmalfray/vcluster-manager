# RBAC de l'opérateur, dérivé de ce que internal/service touche réellement sur le
# chemin backup/restore — pas un cluster-admin de confort.
#
# Les droits sur les ressources d'un vcluster sont volontairement cluster-wide :
# les namespaces vcluster-* apparaissent et disparaissent, on ne peut pas lister
# des RoleBindings par namespace à l'avance. Le périmètre est donc borné par le
# *type* de ressource, pas par le namespace. À resserrer le jour où un opérateur
# par namespace deviendra réaliste.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vcluster-manager-operator
rules:
  # Le marqueur lui-même. Pas de `create` : l'opérateur ne fabrique pas de
  # marqueur, il réconcilie ceux que l'app pose (séparation des rôles du
  # design §6). Pas de `patch` sur l'objet entier non plus — le status a sa
  # propre règle ci-dessous.
  - apiGroups: ["vcluster.rebuild-it.fr"]
    resources: ["vclusterveleroops"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["vcluster.rebuild-it.fr"]
    resources: ["vclusterveleroops/status"]
    verbs: ["get", "update", "patch"]

  # La CRD VCluster. Même découpage : l'opérateur réconcilie ce que Flux applique
  # depuis fluxprod, il ne crée pas de vcluster lui-même — donc pas de `create`.
  # `update` est là pour le finalizer, et pour lui seul : le poser et le retirer
  # sont des écritures dans metadata, hors sous-ressource status. Tout le reste
  # de ce que l'opérateur écrit passe par vclusters/status.
  - apiGroups: ["vcluster.rebuild-it.fr"]
    resources: ["vclusters"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["vcluster.rebuild-it.fr"]
    resources: ["vclusters/status"]
    verbs: ["get", "update", "patch"]

  # Le provisionnement. L'opérateur applique exactement deux objets par vcluster :
  # son namespace, et le ConfigMap vcluster-<nom>-substitutions dans lequel Flux
  # puise les valeurs dérivées du CR. Server-Side Apply passe par `patch`, mais
  # `create` reste nécessaire au premier tour, quand l'objet n'existe pas encore.
  #
  # Pas de `delete` : ce que l'opérateur pose n'est jamais retiré ressource par
  # ressource — désactiver une option vide une clé, elle ne supprime pas d'objet,
  # et le prune du reste appartient à Flux. La destruction complète passera par le
  # finalizer, qui aura sa propre règle.
  # UNE seule règle namespaces, volontairement. Il y en avait deux, à deux
  # endroits, chacune rédigée comme si elle était le total : l'union réelle était
  # get,list,watch,create,patch,update cluster-wide, ce que ni l'une ni l'autre
  # ne laissait voir. `update` + `patch` sur n'importe quel namespace permet de
  # réécrire les labels de kube-system, pod-security.kubernetes.io/enforce
  # compris.
  #
  # create/patch : le SSA du provisionnement (namespace du tenant).
  # update : retirer l'annotation protect-deletion juste avant la destruction.
  # Pas de delete : la disparition du namespace appartient à Flux.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch"]

  # Velero : créer un backup/restore et suivre leur phase.
  # `delete` sur les backups sert à DeleteVeleroBackup, appelé par l'app et non
  # par l'opérateur — retiré ici volontairement.
  - apiGroups: ["velero.io"]
    resources: ["backups", "restores"]
    verbs: ["get", "list", "watch", "create"]

  # Suspendre/reprendre Flux pendant une restauration in-place
  # (SetFluxSuspend patche le HelmRelease et la Kustomization du tenant).
  # `update` en plus pour la fin de la séquence de suppression : CleanupNamespace
  # retire les finalizers Flux, sans quoi le namespace reste en Terminating et le
  # CR avec lui.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "patch", "update"]

  # Parler à l'API interne d'un vcluster (déposer le job rancher-cleanup, lire
  # son état) : le kubeconfig interne vit dans un Secret du namespace hôte, et
  # l'accès passe par un port-forward SPDY vers le pod du plan de contrôle —
  # jamais par un kubeconfig brut.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]

  # Descendre le vcluster à zéro réplique, puis constater que ses pods sont
  # bien partis (detectVClusterTopology lit les deux formes de plan de contrôle,
  # StatefulSet en etcd embarqué ou Deployment en etcd externe).
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Le volume : lire son état pour savoir de quel côté du point de non-retour on
  # se trouve à la reprise (GetVClusterPVCState), et le supprimer pendant la
  # séquence pour que Velero puisse le recréer depuis le backup.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]

  # Élection de leader : deux pods qui se chevauchent pendant un rolling update
  # ne doivent pas piloter la même séquence destructrice.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vcluster-manager-operator
  namespace: vcluster-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vcluster-manager-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vcluster-manager-operator
subjects:
  - kind: ServiceAccount
    name: vcluster-manager-operator
    namespace: vcluster-manager
