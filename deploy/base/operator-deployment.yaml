# L'opérateur est un déploiement distinct du serveur : il ne sert pas d'humains,
# n'a pas d'ingress et ne monte pas le PVC de données. Il réconcilie les marqueurs
# VClusterVeleroOps dans le cluster où il tourne.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcluster-manager-operator
  namespace: vcluster-manager
  labels:
    app: vcluster-manager-operator
spec:
  # Une seule réplique suffit, mais l'élection de leader est quand même active
  # dans le binaire : pendant un rolling update, l'ancien et le nouveau pod se
  # chevauchent quelques secondes, et deux pilotes pour une séquence destructrice
  # est exactement ce qu'on veut éviter.
  replicas: 1
  selector:
    matchLabels:
      app: vcluster-manager-operator
  template:
    metadata:
      labels:
        app: vcluster-manager-operator
    spec:
      serviceAccountName: vcluster-manager-operator
      containers:
        - name: operator
          image: ghcr.io/gmalfray/vcluster-manager-operator:latest
          # Explicite, jamais implicite : cette valeur étiquette l'audit et les
          # métriques. Chaque cell doit la remplacer par son propre nom (ADR-002).
          args: ["--cell=preprod"]
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: probes
          # Même ConfigMap que le serveur : l'opérateur n'a besoin que de
          # VELERO_NAMESPACE et VELERO_DEFAULT_TTL, mais partager la source évite
          # deux endroits où régler la même chose. Elle porte aussi VAULT_ADDR,
          # KEYCLOAK_URL/REALM/CLIENT_ID et RANCHER_URL, qui ne sont pas des
          # secrets — ce sont des adresses, pas des identifiants.
          envFrom:
            - configMapRef:
                name: vcluster-manager-config
          # Quatre clés nommées, jamais `secretRef` sur les Secrets entiers de
          # l'app : vcluster-manager-secrets et vcluster-manager-auth portent
          # aussi GITLAB_TOKEN, SESSION_SECRET, ADMIN_PASSWORD, JWT_SECRET et
          # OIDC_CLIENT_SECRET — dont wireIntegrations (cmd/operator/
          # integrations.go) n'a rien à faire. Prendre le Secret en entier
          # élargirait ce que la compromission de ce pod emporte bien au-delà
          # des trois intégrations que le reconcile pilote réellement (voir
          # docs/etat-brique-operateur.md, l'arbitrage du 2026-08-07).
          env:
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: vcluster-manager-secrets
                  key: VAULT_ROLE_ID
                  optional: true
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: vcluster-manager-secrets
                  key: VAULT_SECRET_ID
                  optional: true
            - name: RANCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vcluster-manager-secrets
                  key: RANCHER_TOKEN
                  optional: true
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vcluster-manager-auth
                  key: KEYCLOAK_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # UID explicite plutôt que `runAsNonRoot: true` seul : l'image ne
            # déclare pas de USER (le serveur y tourne en root), donc kubelet
            # refusait de démarrer le conteneur — « image will run as root ».
            # Le binaire est statique et ne lit que son binaire et les CA du
            # système, tous deux lisibles par tous : n'importe quel UID convient.
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
