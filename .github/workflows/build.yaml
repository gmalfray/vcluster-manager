name: Vérifier, construire et publier l'image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vcluster-manager

jobs:
  # Rien ne vérifiait ce dépôt automatiquement : 41 fichiers de test, une
  # discipline de mutation exigeante, un `make check` documenté — et aucun
  # déclencheur. Ce job est ce déclencheur.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Les CRD sont dérivés de api/v1alpha1, et le harnais envtest les charge
      # depuis config/crd/. Un CRD périmé ferait donc passer les tests contre un
      # schéma qui n'est pas celui déployé : on régénère et on exige zéro diff.
      - name: Manifests à jour
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.0
          controller-gen object paths=./api/...
          controller-gen crd paths=./api/... output:crd:artifacts:config=config/crd
          git diff --exit-code -- config/crd api/v1alpha1/zz_generated.deepcopy.go

      - name: Vet
        run: go vet ./...

      # KUBEBUILDER_ASSETS n'est pas optionnel : internal/controller/suite_test.go
      # fait os.Exit(0) quand la variable est vide. Sans elle, ce job serait vert
      # en n'exécutant AUCUN des 11 fichiers de test du paquet le mieux couvert du
      # dépôt — un vert qui ne veut rien dire est pire qu'un rouge.
      - name: Tests (avec envtest)
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.23
          KUBEBUILDER_ASSETS="$(setup-envtest use 1.35.0 -p path)"
          export KUBEBUILDER_ASSETS
          echo "envtest: $KUBEBUILDER_ASSETS"
          test -x "$KUBEBUILDER_ASSETS/kube-apiserver"
          go test -race -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

  build:
    # Ne pas publier une image qui ne passe pas ses propres tests.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Deux images depuis le même Dockerfile et le même commit : mêmes tags,
          # au même moment. La parité de version est ainsi tenue par le build, pas
          # par la discipline.
          - target: server
            image: vcluster-manager
          - target: operator
            image: vcluster-manager-operator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
